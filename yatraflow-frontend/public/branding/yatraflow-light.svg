<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">YatraFlow</title>
  <desc id="desc">YatraFlow wordmark for the light theme</desc>
  <defs>
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <text x="600" y="205" text-anchor="middle"
        font-family="Manrope, Inter, Arial, Helvetica, sans-serif"
        font-size="170" font-weight="800" letter-spacing="-6">
    <tspan fill="#0F172A">Yatra</tspan>
    <tspan fill="url(#flowGradient)">Flow</tspan>
  </text>
</svg>
